<section class="enrollment-form">
  <h1>Student Enrollment Request</h1>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" novalidate>
    <label for="student-name">Student name</label>
    <input
      id="student-name"
      type="text"
      name="studentName"
      [(ngModel)]="studentName"
      #nameCtrl="ngModel"
      required
      minlength="3" />
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required.</span>
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>

    <label for="student-email">Student email</label>
    <input
      id="student-email"
      type="email"
      name="studentEmail"
      [(ngModel)]="studentEmail"
      #emailCtrl="ngModel"
      required
      email />
    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required.</span>
    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email address.</span>

    <label for="course-id">Course ID</label>
    <input
      id="course-id"
      type="number"
      name="courseId"
      [(ngModel)]="courseId"
      #courseCtrl="ngModel"
      required />
    <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">Course ID is required.</span>

    <label for="semester">Preferred semester</label>
    <select
      id="semester"
      name="preferredSemester"
      [(ngModel)]="preferredSemester"
      #semesterCtrl="ngModel"
      required>
      <option value="" disabled>Select a semester</option>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
    <span *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">Please select a semester.</span>

    <label class="checkbox-label" for="terms">
      <input
        id="terms"
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        #termsCtrl="ngModel"
        required />
      I agree to the terms and conditions.
    </label>
    <span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">You must agree to the terms.</span>

    <div class="form-actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" (click)="resetForm(enrollForm)">Reset</button>
    </div>
  </form>

  <div *ngIf="submitted" class="success-message">
    Enrollment request submitted successfully!
  </div>
  <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
</section>
