<section>
  <h1>{{ portalName }}</h1>
  <p>Explore courses, track your learning, and view your academic progress.</p>

  <div class="stats-row">
    <div><strong>Courses Available:</strong> {{ availableCourses }}</div>
    <div><strong>Enrolled:</strong> 3</div>
    <div><strong>GPA:</strong> 3.8</div>
  </div>

  <app-course-summary-widget></app-course-summary-widget>
  <app-notification></app-notification>

  <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
  <p>{{ message }}</p>

  <label for="course-search">Search courses</label>
  <!-- [property] sends data from the component to the DOM; [(ngModel)] keeps the DOM and component property in sync. -->
  <input id="course-search" [(ngModel)]="searchTerm" placeholder="Enter a course name" />
  <p>Searching for: {{ searchTerm }}</p>
</section>
