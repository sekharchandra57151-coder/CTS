<article
  class="course-card"
  [ngClass]="cardClasses"
  [ngStyle]="{ 'border-left-color': borderColor }"
  (click)="courseSelected.emit(course.id)">
  <h2>{{ course.name }}</h2>
  <p><strong>ID:</strong> {{ course.id }}</p>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>
  <p [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="badge badge--passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge badge--failed">Failed</span>
    <span *ngSwitchDefault class="badge badge--pending">Pending</span>
  </p>
  <button (click)="toggleEnrollment($event)">{{ (isEnrolled$ | async) ? 'Unenroll' : 'Enroll' }}</button>
  <button (click)="toggleDetails($event)">Show Details</button>

  <div *ngIf="isExpanded">
    <p>Course details are now visible.</p>
  </div>
</article>
